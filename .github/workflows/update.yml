name: Sync with GitHub VS Code theme

# Weekly: pull the latest github-vscode-theme release, regenerate,
# and open a pull request when anything changed.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate themes and previews
        run: |
          sh scripts/update.sh
          python scripts/preview.py

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/github-vscode-theme
          commit-message: Sync with latest GitHub VS Code theme
          title: Sync with latest GitHub VS Code theme
          body: Regenerated from the latest github-vscode-theme release on Open VSX.
